components:
  schemas:
    ConversationView:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
        status:
          type: string
          enum:
            - active
            - ended
            - expired
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        agent_release_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        display_name:
          type: string
          minLength: 1
          format: normalized-display-name
          description: Tên đã chuẩn hóa NFC/khoảng trắng, không digit/emoji; giới hạn còn chờ policy.
          nullable: true
        active_activity:
          anyOf:
            - $ref: activity.yaml#/components/schemas/ActivityView
            - type: object
              nullable: true
              enum:
                - null
        created_at:
          type: string
          format: date-time
          pattern: Z$
        expires_at:
          type: string
          format: date-time
          pattern: Z$
      required:
        - id
        - schema_version
        - status
        - revision
        - agent_release_id
        - display_name
        - active_activity
        - created_at
        - expires_at
      additionalProperties: true
      description: |-
        Conversation là cửa vào chat; pin Agent Release lúc tạo. Runtime sở hữu conversation/messages/activities/results; Product/Studio sở hữu config/releases.
        GET phục hồi ngữ cảnh và active activity, không tự tạo chat/activity mới. History phân trang qua messages.
        Activity completion không đóng conversation: học sinh tiếp tục chat về kết quả trong cùng khung chat.
        End conversation đóng các activity đang chạy; expiry kiểm theo đồng hồ server. Read-after-close/retention còn chờ DEC-03.
    MessageTurnInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Conversation revision đang hiển thị; không phải activity/result revision.
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
          default: 1
        type:
          type: string
          enum:
            - message
        content:
          type: object
          properties:
            text:
              type: string
              minLength: 1
              pattern: \S
          required:
            - text
          additionalProperties: false
      required:
        - expected_revision
        - idempotency_key
        - type
        - content
      additionalProperties: false
      description: Text đi qua intent router. Agent có thể đề xuất start_activity/set_name/answer; Engine chỉ commit
        command hợp lệ theo policy, membership và revision. Text chat chung không tự tăng progress.
    SetNameInteraction:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Conversation revision đang hiển thị; không phải activity/result revision.
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
          default: 1
        type:
          type: string
          enum:
            - interaction
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        action:
          type: string
          enum:
            - set_name
        payload:
          type: object
          properties:
            display_name:
              type: string
              minLength: 1
              format: display-name
              description: 'Input: NFC + trim/collapse Unicode whitespace; letters/marks/spaces, no digits/emoji.
                Maximum from approved runtime policy; DEC-01 limit pending.'
          required:
            - display_name
          additionalProperties: false
        expected_activity_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Guard bổ sung nếu client dùng state từ activity read API; server luôn kiểm proposal/question/activity
            state dù field không gửi.
      required:
        - expected_revision
        - idempotency_key
        - type
        - activity_id
        - action
        - payload
      additionalProperties: false
    SubmitAnswerInteraction:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Conversation revision đang hiển thị; không phải activity/result revision.
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
          default: 1
        type:
          type: string
          enum:
            - interaction
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        action:
          type: string
          enum:
            - submit_answer
        payload:
          oneOf:
            - type: object
              properties:
                question_id:
                  type: string
                  minLength: 1
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                option_id:
                  type: string
                  minLength: 1
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
              required:
                - question_id
                - option_id
              additionalProperties: false
            - type: object
              properties:
                question_id:
                  type: string
                  minLength: 1
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                text:
                  type: string
                  minLength: 1
                  pattern: \S
              required:
                - question_id
                - text
              additionalProperties: false
        expected_activity_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Guard bổ sung nếu client dùng state từ activity read API; server luôn kiểm proposal/question/activity
            state dù field không gửi.
      required:
        - expected_revision
        - idempotency_key
        - type
        - activity_id
        - action
        - payload
      additionalProperties: false
    ConfirmAnswerInteraction:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Conversation revision đang hiển thị; không phải activity/result revision.
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
          default: 1
        type:
          type: string
          enum:
            - interaction
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        action:
          type: string
          enum:
            - confirm_answer
        payload:
          type: object
          properties:
            proposal_id:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
            question_id:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
            candidate_id:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          required:
            - proposal_id
            - question_id
            - candidate_id
          additionalProperties: false
        expected_activity_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Guard bổ sung nếu client dùng state từ activity read API; server luôn kiểm proposal/question/activity
            state dù field không gửi.
      required:
        - expected_revision
        - idempotency_key
        - type
        - activity_id
        - action
        - payload
      additionalProperties: false
    EditAnswerInteraction:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Conversation revision đang hiển thị; không phải activity/result revision.
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
          default: 1
        type:
          type: string
          enum:
            - interaction
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        action:
          type: string
          enum:
            - edit_answer
        payload:
          type: object
          properties:
            question_id:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
            option_id:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          required:
            - question_id
            - option_id
          additionalProperties: false
        expected_activity_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Guard bổ sung nếu client dùng state từ activity read API; server luôn kiểm proposal/question/activity
            state dù field không gửi.
      required:
        - expected_revision
        - idempotency_key
        - type
        - activity_id
        - action
        - payload
      additionalProperties: false
    InteractionTurnInput:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SetNameInteraction'
        - $ref: '#/components/schemas/SubmitAnswerInteraction'
        - $ref: '#/components/schemas/ConfirmAnswerInteraction'
        - $ref: '#/components/schemas/EditAnswerInteraction'
      discriminator:
        propertyName: action
        mapping:
          set_name: '#/components/schemas/SetNameInteraction'
          submit_answer: '#/components/schemas/SubmitAnswerInteraction'
          confirm_answer: '#/components/schemas/ConfirmAnswerInteraction'
          edit_answer: '#/components/schemas/EditAnswerInteraction'
      description: Activity phải thuộc conversation và là target được phép thao tác. Structured interaction đi thẳng
        Engine, option click không cần LLM.
    ConversationTurnInput:
      oneOf:
        - $ref: '#/components/schemas/MessageTurnInput'
        - $ref: '#/components/schemas/InteractionTurnInput'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/MessageTurnInput'
          interaction: '#/components/schemas/InteractionTurnInput'
    ConversationTurnResult:
      type: object
      properties:
        conversation_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        turn_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        message_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        committed_at:
          type: string
          format: date-time
          pattern: Z$
        activity:
          anyOf:
            - $ref: activity.yaml#/components/schemas/ActivityView
            - type: object
              nullable: true
              enum:
                - null
        blocks:
          type: array
          items:
            $ref: typed-blocks.yaml#/components/schemas/TypedBlock
          minItems: 1
      required:
        - conversation_id
        - schema_version
        - revision
        - turn_id
        - message_id
        - committed_at
        - activity
        - blocks
      additionalProperties: true
      description: |-
        revision thuộc conversation; activity.revision thuộc activity. General chat có activity null hoặc state không đổi.
        Commit parent revision, activity changes, answers/proposal/result validity, messages/blocks và replay outcome nguyên tử.
        Lượt trả lời thứ 6 đủ coverage trả personality_card ngay. Lỗi engine không để progress/result commit một phần.
        Replay data giữ nguyên turn/message/block IDs, committed_at và snapshot; meta thuộc HTTP request mới. Client không ghi đè conversation state mới bằng outcome cũ.
    ConversationTurnEnvelope:
      oneOf:
        - allOf:
            - $ref: common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ConversationTurnResult'
        - $ref: common.yaml#/components/schemas/ErrorEnvelope
