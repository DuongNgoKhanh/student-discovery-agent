openapi: 3.0.3
info:
  title: Student Discovery - Admin Users
  version: 1.0.0
  description: Contract theo resource. Quy ước chung và các quyết định còn mở nằm trong admin-api.yaml; xem README.md
    để chọn nhóm API. Schema dùng chung được tham chiếu bằng $ref.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server
tags:
  - name: Admin-Users
    description: Admin user management operations
paths:
  /admin/users:
    get:
      tags:
        - Admin-Users
      summary: List admin-managed users
      description: Retrieve a paginated list of users with filtering and sorting options.
      operationId: adminListUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (starting from 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: order_by
          in: query
          required: false
          description: Field to order results by
          schema:
            type: string
            default: created_at
        - name: dir
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: name
          in: query
          required: false
          description: Filter by user name (partial match)
          schema:
            type: string
        - name: email
          in: query
          required: false
          description: Filter by email address (partial match)
          schema:
            type: string
        - name: position
          in: query
          required: false
          description: Filter by job position
          schema:
            type: string
        - name: is_deleted
          in: query
          required: false
          description: Filter by deleted status
          schema:
            type: boolean
      responses:
        '200':
          description: Users list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaginatedUsersResponse'
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: schemas/common.yaml#/components/responses/ValidationError
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
    post:
      tags:
        - Admin-Users
      summary: Create a new user via admin
      description: Create a new user record with optional profile fields.
      operationId: adminCreateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreate'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: schemas/common.yaml#/components/schemas/ApiResponse
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: schemas/common.yaml#/components/responses/ValidationError
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
    delete:
      tags:
        - Admin-Users
      summary: Bulk soft delete users
      description: Soft delete multiple users by their IDs.
      operationId: adminBulkDeleteUsers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBulkUserDelete'
      responses:
        '200':
          description: Bulk delete completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserBulkResponse'
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: schemas/common.yaml#/components/responses/ValidationError
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
  /admin/users/bulk/create:
    post:
      tags:
        - Admin-Users
      summary: Bulk create users
      description: Create multiple user records in a single request.
      operationId: adminBulkCreateUsers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBulkUserCreate'
      responses:
        '200':
          description: Bulk create completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserBulkResponse'
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: schemas/common.yaml#/components/responses/ValidationError
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
  /admin/users/bulk/update:
    put:
      tags:
        - Admin-Users
      summary: Bulk update users
      description: Update multiple users in a single request.
      operationId: adminBulkUpdateUsers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBulkUserUpdate'
      responses:
        '200':
          description: Bulk update completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserBulkResponse'
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: schemas/common.yaml#/components/responses/ValidationError
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
  /admin/users/{user_id}:
    get:
      tags:
        - Admin-Users
      summary: Get admin user by ID
      description: Retrieve a specific user's profile by ID.
      operationId: adminGetUserById
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: schemas/common.yaml#/components/schemas/ApiResponse
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
    put:
      tags:
        - Admin-Users
      summary: Update an existing user
      description: Update a user's profile data and optional status fields.
      operationId: adminUpdateUser
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: schemas/common.yaml#/components/schemas/ApiResponse
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: schemas/common.yaml#/components/responses/ValidationError
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
    delete:
      tags:
        - Admin-Users
      summary: Soft delete a user
      description: Soft delete a single user by ID.
      operationId: adminDeleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: User soft deleted successfully
          content:
            application/json:
              schema:
                $ref: schemas/common.yaml#/components/schemas/ApiResponse
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
  /admin/users/{user_id}/restore:
    post:
      tags:
        - Admin-Users
      summary: Restore a soft-deleted user
      description: Restore a previously soft deleted user by ID.
      operationId: adminRestoreUser
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: User restored successfully
          content:
            application/json:
              schema:
                $ref: schemas/common.yaml#/components/schemas/ApiResponse
        '400':
          $ref: schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: admin-auth-api.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: schemas/common.yaml#/components/responses/InternalServerError
components:
  schemas:
    AdminUserResponse:
      type: object
      required:
        - id
        - email
        - is_deleted
        - created_at
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          nullable: true
          example: John Doe
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://example.com/avatars/user_1.jpg
        bio:
          type: string
          nullable: true
          example: Software developer
        position:
          type: string
          nullable: true
          example: Senior Developer
        is_deleted:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: '2025-04-18T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-04-19T09:30:00Z'
    AdminUserCreate:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          nullable: true
          example: optionalPassword123
        name:
          type: string
          nullable: true
          example: John Doe
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://example.com/avatars/user_1.jpg
        bio:
          type: string
          nullable: true
          example: Software developer
        position:
          type: string
          nullable: true
          example: Senior Developer
    AdminUserUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
          example: John Doe
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://example.com/avatars/user_1.jpg
        bio:
          type: string
          nullable: true
          example: Software developer
        position:
          type: string
          nullable: true
          example: Senior Developer
        password:
          type: string
          nullable: true
          example: newPassword123
        is_deleted:
          type: boolean
          nullable: true
          example: false
    AdminBulkUserCreate:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserCreate'
    AdminBulkUserUpdate:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            type: object
            required:
              - id
              - updates
            properties:
              id:
                type: integer
                example: 1
              updates:
                $ref: '#/components/schemas/AdminUserUpdate'
    AdminBulkUserDelete:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          items:
            type: integer
          example:
            - 1
            - 2
            - 3
    AdminUserBulkResult:
      type: object
      required:
        - success
        - user_id
        - status
        - data
        - error
        - meta
      properties:
        success:
          type: boolean
          example: true
        user_id:
          type: integer
          example: 1
        error:
          anyOf:
            - $ref: schemas/common.yaml#/components/schemas/ErrorDetail
            - type: object
              nullable: true
              enum:
                - null
        status:
          type: integer
          description: HTTP status; inspect success even for HTTP 200.
        meta:
          $ref: schemas/common.yaml#/components/schemas/ResponseMeta
    AdminUserBulkResponse:
      type: object
      required:
        - success
        - data
        - total_processed
        - total_success
        - total_failed
        - status
        - error
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserBulkResult'
        total_processed:
          type: integer
          example: 3
        total_success:
          type: integer
          example: 3
        total_failed:
          type: integer
          example: 0
        status:
          type: integer
          description: HTTP status; inspect success even for HTTP 200.
        error:
          anyOf:
            - $ref: schemas/common.yaml#/components/schemas/ErrorDetail
            - type: object
              nullable: true
              enum:
                - null
        meta:
          $ref: schemas/common.yaml#/components/schemas/ResponseMeta
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
        - has_next
        - has_prev
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 123
        total_pages:
          type: integer
          example: 7
        has_next:
          type: boolean
          example: true
        has_prev:
          type: boolean
          example: false
    AdminPaginatedUsersResponse:
      type: object
      required:
        - success
        - data
        - pagination
        - status
        - error
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Users retrieved successfully
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        status:
          type: integer
          description: HTTP status; inspect success even for HTTP 200.
        error:
          anyOf:
            - $ref: schemas/common.yaml#/components/schemas/ErrorDetail
            - type: object
              nullable: true
              enum:
                - null
        meta:
          $ref: schemas/common.yaml#/components/schemas/ResponseMeta
  responses:
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: schemas/common.yaml#/components/schemas/ErrorResponse
          example:
            status: 404
            success: false
            message: Resource not found
            data: null
            error:
              code: RES_NOT_FOUND
              message: Resource not found
              details: null
              retryable: false
            meta:
              request_id: req-example
              trace_id: trace-example
              timestamp: '2026-10-12T03:00:00Z'
    ForbiddenError:
      description: Forbidden - Admin access required
      content:
        application/json:
          schema:
            $ref: schemas/common.yaml#/components/schemas/ErrorResponse
          example:
            status: 403
            success: false
            message: Admin access required
            data: null
            error:
              code: AUTHZ_INSUFFICIENT_PERMISSION
              message: Admin access required
              details: null
              retryable: false
            meta:
              request_id: req-example
              trace_id: trace-example
              timestamp: '2026-10-12T03:00:00Z'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT access token required for protected admin endpoints
