components:
  schemas:
    ApiResponse:
      type: object
      required:
        - status
        - success
        - message
        - data
        - error
        - meta
      properties:
        status:
          type: integer
          description: HTTP status; inspect success even for HTTP 200.
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          description: Endpoint-specific object, array, scalar or null (untyped, so null is allowed).
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: object
              nullable: true
              enum:
                - null
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      required:
        - request_id
        - trace_id
        - timestamp
      properties:
        request_id:
          type: string
          format: uuid
        trace_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          pattern: \.\d{3}Z$
    ErrorDetail:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          $ref: 'error-codes.yaml#/components/schemas/ErrorCode'
        legacy_code:
          type: string
          description: Historical name when the transport canonicalized a registered alias.
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
          nullable: true
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            success:
              type: boolean
              enum:
                - false
            error:
              $ref: '#/components/schemas/ErrorDetail'
    ChatResponseMeta:
      type: object
      properties:
        request_id:
          type: string
          minLength: 1
          format: uuid
        trace_id:
          type: string
          minLength: 1
          format: uuid
        timestamp:
          type: string
          format: date-time
          pattern: \.\d{3}Z$
        replayed:
          type: boolean
      required:
        - request_id
        - trace_id
        - timestamp
      additionalProperties: true
    RevisionConflictDetails:
      type: object
      properties:
        kind:
          type: string
          enum:
            - revision_conflict
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        actual_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        conversation:
          anyOf:
            - $ref: chat.yaml#/components/schemas/ConversationView
            - type: object
              nullable: true
              enum:
                - null
        activity:
          anyOf:
            - $ref: activity.yaml#/components/schemas/ActivityView
            - type: object
              nullable: true
              enum:
                - null
        resource_kind:
          type: string
          enum:
            - conversation
            - activity
          description: Optional. Which guard failed; for activity both revision fields are activity revisions.
      required:
        - kind
        - expected_revision
        - actual_revision
        - conversation
        - activity
      additionalProperties: true
      description: Snapshot chỉ trả khi caller có quyền đọc; activity guard có thể gây conflict dù conversation
        guard đúng.
    ProductMetadataRevisionConflictDetails:
      type: object
      description: Product metadata counter conflict; independent of the experience draft and runtime counters.
      properties:
        kind:
          type: string
          enum:
            - revision_conflict
        expected_metadata_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        actual_metadata_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - kind
        - expected_metadata_revision
        - actual_metadata_revision
      additionalProperties: false
    ProductDraftRevisionConflictDetails:
      type: object
      description: Product draft counter conflict on save or publish. Save may include the current draft hash.
      properties:
        kind:
          type: string
          enum:
            - revision_conflict
        expected_draft_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        actual_draft_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        current_content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
      required:
        - kind
        - expected_draft_revision
        - actual_draft_revision
      additionalProperties: false
    StaleResultDetails:
      type: object
      properties:
        kind:
          type: string
          enum:
            - stale_result
        result_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        expected_result_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          nullable: true
        current_result:
          anyOf:
            - $ref: activity.yaml#/components/schemas/ActivityResultRef
            - type: object
              nullable: true
              enum:
                - null
      required:
        - kind
        - result_id
        - expected_result_revision
        - current_result
      additionalProperties: true
    SnapshotConflictDetails:
      type: object
      properties:
        kind:
          type: string
          enum:
            - snapshot_conflict
        resource_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        actual_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        current_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
          nullable: true
      required:
        - kind
        - resource_id
        - expected_revision
        - actual_revision
        - current_hash
      additionalProperties: true
    ValidationIssue:
      type: object
      properties:
        path:
          type: string
        code:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        message:
          type: string
          minLength: 1
        rule_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          nullable: true
      required:
        - path
        - code
        - message
        - rule_id
      additionalProperties: true
    ValidationDetails:
      type: object
      properties:
        kind:
          type: string
          enum:
            - validation
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          minItems: 1
      required:
        - kind
        - issues
      additionalProperties: true
    DomainError:
      type: object
      properties:
        code:
          $ref: 'error-codes.yaml#/components/schemas/ErrorCode'
        legacy_code:
          type: string
          description: Historical name when the transport canonicalized a registered alias.
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        details:
          anyOf:
            - $ref: '#/components/schemas/RevisionConflictDetails'
            - $ref: '#/components/schemas/ProductMetadataRevisionConflictDetails'
            - $ref: '#/components/schemas/ProductDraftRevisionConflictDetails'
            - $ref: '#/components/schemas/StaleResultDetails'
            - $ref: '#/components/schemas/SnapshotConflictDetails'
            - $ref: '#/components/schemas/ValidationDetails'
            - type: object
              properties:
                kind:
                  type: string
                  minLength: 1
                  not:
                    type: string
                    enum:
                      - revision_conflict
                      - stale_result
                      - snapshot_conflict
                      - validation
              required:
                - kind
              additionalProperties: true
            - type: object
              nullable: true
              enum:
                - null
      required:
        - code
        - message
        - retryable
        - details
      additionalProperties: true
      description: |-
        Stable domain codes; unknown code/details kind có generic fallback.
        400 VAL_INVALID_REQUEST: malformed JSON/duplicate keys/non-finite number.
        401 AUTH_TOKEN_MISSING; 403 AUTHZ_FORBIDDEN; 404 RES_NOT_FOUND gồm inaccessible resource.
        409 CONFLICT_REVISION, CONFLICT_IDEMPOTENCY_KEY, CONFLICT_STALE_CLARIFICATION, CONFLICT_STALE_RESULT_REVISION, CONFLICT_STALE_REPORT, CONFLICT_ACTIVE_RELEASE.
        410 RES_CONVERSATION_ENDED, RES_CONVERSATION_EXPIRED.
        413 VAL_PAYLOAD_TOO_LARGE.
        422 VAL_INVALID_INPUT, VAL_INVALID_ACTIVITY_TRANSITION, VAL_INVALID_QUESTION, VAL_INVALID_OPTION, RES_RESULT_NOT_READY,
            VAL_INCOMPATIBLE_SCHEMA, VAL_INCOMPATIBLE_RELEASE, RES_EXPERIENCE_NOT_CONFIGURED, PUBLISH_GATE_FAILED, SYS_ENGINE_FAILURE.
        429 SYS_RATE_LIMITED; 500 SYS_INTERNAL_ERROR; 503 SYS_UNAVAILABLE; 504 SYS_REQUEST_TIMEOUT.
        Conflict/stale không auto-retry: sync state và tạo action mới. Transient retry giữ key/payload và budget.
        HTTP mapping này áp dụng Chat/Studio mới theo proposal; API scaffold cũ giữ quy ước hiện hữu.
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: integer
          minimum: 200
          maximum: 299
        success:
          type: boolean
          enum:
            - true
        data: {}
        error:
          type: object
          nullable: true
          enum:
            - null
        meta:
          $ref: '#/components/schemas/ChatResponseMeta'
        message:
          type: string
          nullable: true
      required:
        - status
        - success
        - message
        - data
        - error
        - meta
      additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        success:
          type: boolean
          enum:
            - false
        data:
          type: object
          nullable: true
          enum:
            - null
        error:
          $ref: '#/components/schemas/DomainError'
        meta:
          $ref: '#/components/schemas/ChatResponseMeta'
        message:
          type: string
          nullable: true
      required:
        - status
        - success
        - data
        - error
        - meta
      additionalProperties: true
  responses:
    BadRequestError:
      description: Bad request - Invalid input data or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            success: false
            message: Invalid input
            data: null
            error:
              code: VAL_INVALID_REQUEST
              message: Invalid input
              details: null
              retryable: false
            meta:
              request_id: req-example
              trace_id: trace-example
              timestamp: '2026-10-12T03:00:00Z'
    ValidationError:
      description: Validation error - Invalid input data format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 422
            success: false
            message: Input data validation failed
            data: null
            error:
              code: VAL_INVALID_INPUT
              message: Input data validation failed
              details: null
              retryable: false
            meta:
              request_id: req-example
              trace_id: trace-example
              timestamp: '2026-10-12T03:00:00Z'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            success: false
            message: An unexpected error occurred
            data: null
            error:
              code: SYS_INTERNAL_ERROR
              message: An unexpected error occurred
              details: null
              retryable: true
            meta:
              request_id: req-example
              trace_id: trace-example
              timestamp: '2026-10-12T03:00:00Z'
    ChatError400:
      description: Malformed JSON/request
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError401:
      description: Anonymous/admin credential missing where required, invalid or expired. POST /conversations
        accepts a missing anonymous cookie to create an owner; a presented invalid/expired cookie still returns 401.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError403:
      description: Insufficient permission
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError404:
      description: Not found or inaccessible resource
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError409:
      description: Revision/key/proposal/result/report conflict; synchronize before new action
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            conflict:
              $ref: '#/components/examples/RevisionConflict'
    ChatError410:
      description: Conversation ended/expired
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError413:
      description: Payload limit exceeded
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError422:
      description: Semantic input/action/release/config/engine failure
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError429:
      description: Rate limited
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
        Retry-After:
          schema:
            type: string
          description: Backoff per runtime policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError500:
      description: System failure; retry same key/payload if retryable
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError503:
      description: Service unavailable
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChatError504:
      description: Timeout; outcome may have committed
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  examples:
    RevisionConflict:
      summary: Đồng bộ state trước action mới.
      value:
        status: 409
        success: false
        data: null
        error:
          code: CONFLICT_REVISION
          message: Conversation đã thay đổi.
          retryable: false
          details:
            kind: revision_conflict
            expected_revision: 3
            actual_revision: 4
            conversation: null
            activity: null
        meta:
          request_id: req_example
          trace_id: trace_example
          timestamp: '2026-10-12T03:00:00Z'
