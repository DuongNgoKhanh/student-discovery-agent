components:
  schemas:
    ChatflowIdentifier:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,39}$'
      description: Định danh ổn định của node, cạnh, biến hoặc persona case.
    ChatflowNodeType:
      type: string
      enum: [start, if_else, intent_classifier, llm, agent, knowledge_retrieval, tool, profile_propose, assign, answer]
      description: Mười loại node của đợt 1. code, http, vòng lặp, nhánh song song và sub-workflow chưa được hỗ trợ (workflow_node_type_unsupported).
    ChatflowVariable:
      type: object
      additionalProperties: false
      required: [name, type, default]
      properties:
        name: {$ref: '#/components/schemas/ChatflowIdentifier'}
        type: {type: string, enum: [string, number, boolean, enum, string_list]}
        values:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items: {type: string, minLength: 1, pattern: '\S'}
          description: Bắt buộc với enum và chỉ enum mới có (workflow_variable_invalid).
        default:
          description: Phải hợp lệ với type (enum phải nằm trong values); sai thì workflow_variable_invalid.
    ChatflowNode:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id: {$ref: '#/components/schemas/ChatflowIdentifier'}
        type: {$ref: '#/components/schemas/ChatflowNodeType'}
        title: {type: string, minLength: 1, maxLength: 100, pattern: '\S'}
        config:
          type: object
          additionalProperties: true
          description: Schema theo loại node do runtime công bố qua danh mục loại node; kiểm sâu ở validator đồ thị.
        ui:
          type: object
          additionalProperties: false
          properties:
            position:
              type: object
              additionalProperties: false
              required: [x, y]
              properties:
                x: {type: number}
                y: {type: number}
          description: Chỉ phục vụ hiển thị; runtime bỏ qua nhưng content_hash vẫn đổi.
    ChatflowEdge:
      type: object
      additionalProperties: false
      required: [id, source, source_handle, target]
      properties:
        id: {$ref: '#/components/schemas/ChatflowIdentifier'}
        source: {$ref: '#/components/schemas/ChatflowIdentifier'}
        source_handle: {$ref: '#/components/schemas/ChatflowIdentifier'}
        target: {$ref: '#/components/schemas/ChatflowIdentifier'}
    ChatflowBudget:
      type: object
      additionalProperties: false
      properties:
        max_nodes: {type: integer, minimum: 1, default: 20}
        max_llm_calls: {type: integer, minimum: 1, default: 6}
        turn_timeout_ms: {type: integer, minimum: 1, default: 25000}
      description: Mặc định theo baseline DEC-24; trần cứng do validator đồ thị kiểm sau khi DEC-24 chốt.
    ChatflowWorkflow:
      type: object
      additionalProperties: false
      required: [entry, nodes]
      properties:
        entry: {$ref: '#/components/schemas/ChatflowIdentifier'}
        variables:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/ChatflowVariable'}
        nodes:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/ChatflowNode'}
        edges:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ChatflowEdge'}
        budget: {$ref: '#/components/schemas/ChatflowBudget'}
      description: Trùng id (node, cạnh, tên biến) là duplicate_items; id node sys, conv, profile, result là workflow_node_id_reserved. Kiểm DAG, handle, biểu thức, tool và KB thuộc validator đồ thị (T14).
    ChatflowPersonaTurn:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: object
          additionalProperties: false
          description: "Đúng một trong text hoặc interaction."
          properties:
            text: {type: string, minLength: 1, maxLength: 4000}
            interaction:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {type: string, minLength: 1}
                outcome: {type: string, minLength: 1}
                option_id: {type: string, minLength: 1}
          oneOf:
            - required: [text]
            - required: [interaction]
        llm_stubs:
          type: object
          additionalProperties: true
          description: Output cố định cho từng node gọi model, khóa là node id.
        expect:
          type: object
          additionalProperties: false
          description: "Kỳ vọng sau lượt. path khớp chính xác, đúng thứ tự; conv chỉ kiểm các khóa được liệt kê."
          properties:
            path: {type: array, items: {$ref: '#/components/schemas/ChatflowIdentifier'}}
            blocks_present: {type: array, items: {type: string, enum: [text, markdown, suggestions, assessment_question, assessment_clarification, personality_card, knowledge_card]}}
            blocks_absent: {type: array, items: {type: string, enum: [text, markdown, suggestions, assessment_question, assessment_clarification, personality_card, knowledge_card]}}
            conv: {type: object, additionalProperties: true}
            proposals: {type: integer, minimum: 0}
            status: {type: string, enum: [completed, fallback]}
    ChatflowPersonaCase:
      type: object
      additionalProperties: false
      required: [id, title, turns]
      properties:
        id: {$ref: '#/components/schemas/ChatflowIdentifier'}
        title: {type: string, minLength: 1, maxLength: 100, pattern: '\S'}
        mandatory: {type: boolean, default: false}
        initial_state:
          type: object
          additionalProperties: false
          description: "Trạng thái giả lập ban đầu; hồ sơ, result, activity giữ nguyên qua các lượt, conv.* chuyển tiếp từ lượt trước."
          properties:
            profile: {type: object, additionalProperties: true}
            result: {type: object, nullable: true, additionalProperties: true}
            conv: {type: object, additionalProperties: true}
            activity: {type: object, nullable: true, additionalProperties: true}
        turns:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ChatflowPersonaTurn'}
