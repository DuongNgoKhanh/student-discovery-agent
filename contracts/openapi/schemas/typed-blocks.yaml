components:
  schemas:
    HouseIdentity:
      type: object
      properties:
        house_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        name:
          type: string
          minLength: 1
        theme_ref:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        mascot_ref:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      required:
        - house_id
        - name
        - theme_ref
        - mascot_ref
      additionalProperties: true
    PersonalityCardData:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          format: normalized-display-name
          description: Tên đã chuẩn hóa NFC/khoảng trắng, không digit/emoji; giới hạn còn chờ policy.
        house:
          $ref: '#/components/schemas/HouseIdentity'
        strengths:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        tendencies:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        career_groups:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        quote:
          type: string
          minLength: 1
        is_demo:
          type: boolean
      required:
        - display_name
        - house
        - strengths
        - tendencies
        - career_groups
        - quote
        - is_demo
      additionalProperties: true
      description: Metadata từ pinned experience release. Không tự thêm phần trăm/matching trường/học phí. Các House/taxonomy/scoring
        chính thức còn chờ DEC-04/chuyên môn.
    TextBlock:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
            - text
        schema_version:
          type: integer
          enum:
            - 1
        content:
          type: string
          minLength: 1
      required:
        - block_id
        - type
        - schema_version
        - content
      additionalProperties: true
    MarkdownBlock:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
            - markdown
        schema_version:
          type: integer
          enum:
            - 1
        content:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
      required:
        - block_id
        - type
        - schema_version
        - content
      additionalProperties: true
      description: Server từ chối HTML, ảnh và link (inline hoặc reference-style) không phải http/https; client vẫn phải
        sanitize khi render. Server hạ về text v1 nếu client không khai báo markdown trong supported_blocks.
    SuggestionItem:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          pattern: \S
        message_text:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
      required:
        - label
        - message_text
      additionalProperties: false
    SuggestionsBlock:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
            - suggestions
        schema_version:
          type: integer
          enum:
            - 1
        items:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/SuggestionItem'
      required:
        - block_id
        - type
        - schema_version
        - items
      additionalProperties: true
      description: Quick replies, label không trùng. Chọn một item thì gửi message turn với content.text = message_text.
        Server hạ về text v1 nếu client không khai báo suggestions.
    AssessmentQuestionBlock:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
            - assessment_question
        schema_version:
          type: integer
          enum:
            - 1
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        question_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        title:
          type: string
          minLength: 1
        options:
          type: array
          items:
            $ref: activity.yaml#/components/schemas/AssessmentOption
          minItems: 2
        progress:
          $ref: activity.yaml#/components/schemas/AssessmentProgress
      required:
        - block_id
        - type
        - schema_version
        - activity_id
        - question_id
        - title
        - options
        - progress
      additionalProperties: true
    AssessmentClarificationBlock:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
            - assessment_clarification
        schema_version:
          type: integer
          enum:
            - 1
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        proposal_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        question_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        activity_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        title:
          type: string
          minLength: 1
        candidates:
          type: array
          items:
            $ref: activity.yaml#/components/schemas/ClarificationCandidate
          minItems: 1
        progress:
          $ref: activity.yaml#/components/schemas/AssessmentProgress
      required:
        - block_id
        - type
        - schema_version
        - activity_id
        - proposal_id
        - question_id
        - activity_revision
        - title
        - candidates
        - progress
      additionalProperties: true
    PersonalityCardBlock:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
            - personality_card
        schema_version:
          type: integer
          enum:
            - 1
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        result_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        result_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        data:
          $ref: '#/components/schemas/PersonalityCardData'
      required:
        - block_id
        - type
        - schema_version
        - activity_id
        - result_id
        - result_revision
        - data
      additionalProperties: true
    KnowledgeCardField:
      type: object
      properties:
        label: {type: string, minLength: 1, maxLength: 60, pattern: \S}
        value: {type: string, minLength: 1, maxLength: 500, pattern: \S}
      required: [label, value]
      additionalProperties: false
    KnowledgeCardBlock:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
            - knowledge_card
        schema_version:
          type: integer
          enum:
            - 1
        title: {type: string, minLength: 1, maxLength: 300, pattern: \S}
        fields:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeCardField'
          minItems: 1
          maxItems: 8
        source_url: {type: string, nullable: true, maxLength: 2000, pattern: '^https://\S+$'}
        document_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        updated_at: {type: string, format: date-time}
      required: [block_id, type, schema_version, title, fields, document_id, revision, updated_at]
      additionalProperties: true
      description: Server dựng từ revision knowledge mà model đã thấy trong lượt; value là chuỗi đã định dạng. Server hạ về
        markdown v1 (rồi text v1) nếu client không khai báo knowledge_card trong supported_blocks.
    TypedBlock:
      oneOf:
      - $ref: '#/components/schemas/TextBlock'
      - $ref: '#/components/schemas/MarkdownBlock'
      - $ref: '#/components/schemas/SuggestionsBlock'
      - $ref: '#/components/schemas/AssessmentQuestionBlock'
      - $ref: '#/components/schemas/AssessmentClarificationBlock'
      - $ref: '#/components/schemas/PersonalityCardBlock'
      - $ref: '#/components/schemas/AssessmentQuestionBlockV2'
      - $ref: '#/components/schemas/AssessmentClarificationBlockV2'
      - $ref: '#/components/schemas/KnowledgeCardBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          markdown: '#/components/schemas/MarkdownBlock'
          suggestions: '#/components/schemas/SuggestionsBlock'
          assessment_question: '#/components/schemas/AssessmentQuestionBlockVersions'
          assessment_clarification: '#/components/schemas/AssessmentClarificationBlockVersions'
          personality_card: '#/components/schemas/PersonalityCardBlock'
          knowledge_card: '#/components/schemas/KnowledgeCardBlock'
      description: Backend validates every block. IDs/version ổn định qua replay/history; text không thực thi HTML.
        Unknown block/version → incompatibility có kiểm soát trước submit tiếp.
    AssessmentQuestionBlockV2:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
          - assessment_question
        schema_version:
          type: integer
          enum:
          - 2
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        question_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        title:
          type: string
          minLength: 1
        options:
          type: array
          items:
            $ref: activity.yaml#/components/schemas/AssessmentOption
          minItems: 2
        progress:
          $ref: activity.yaml#/components/schemas/AssessmentProgressV2
      required:
      - block_id
      - type
      - schema_version
      - activity_id
      - question_id
      - title
      - options
      - progress
      additionalProperties: true
    AssessmentQuestionBlockVersions:
      type: object
      oneOf:
      - $ref: '#/components/schemas/AssessmentQuestionBlock'
      - $ref: '#/components/schemas/AssessmentQuestionBlockV2'
      discriminator:
        propertyName: schema_version
        mapping:
          '1': '#/components/schemas/AssessmentQuestionBlock'
          '2': '#/components/schemas/AssessmentQuestionBlockV2'
    AssessmentClarificationBlockV2:
      type: object
      properties:
        block_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        type:
          type: string
          enum:
          - assessment_clarification
        schema_version:
          type: integer
          enum:
          - 2
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        proposal_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        question_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        activity_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        title:
          type: string
          minLength: 1
        candidates:
          type: array
          items:
            $ref: activity.yaml#/components/schemas/ClarificationCandidate
          minItems: 1
        progress:
          $ref: activity.yaml#/components/schemas/AssessmentProgressV2
      required:
      - block_id
      - type
      - schema_version
      - activity_id
      - proposal_id
      - question_id
      - activity_revision
      - title
      - candidates
      - progress
      additionalProperties: true
    AssessmentClarificationBlockVersions:
      type: object
      oneOf:
      - $ref: '#/components/schemas/AssessmentClarificationBlock'
      - $ref: '#/components/schemas/AssessmentClarificationBlockV2'
      discriminator:
        propertyName: schema_version
        mapping:
          '1': '#/components/schemas/AssessmentClarificationBlock'
          '2': '#/components/schemas/AssessmentClarificationBlockV2'
