openapi: 3.0.3
info:
  title: Student Discovery - Experience Configuration
  version: 1.0.0
  description: Contract theo resource. Quy ước chung và các quyết định còn mở nằm trong admin-api.yaml; xem README.md
    để chọn nhóm API. Schema dùng chung được tham chiếu bằng $ref.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server
tags:
  - name: Studio Experiences
    description: Metadata/draft, validation/evaluation and isolated preview.
paths:
  /admin/experiences:
    get:
      operationId: listExperiences
      tags:
        - Studio Experiences
      summary: Danh sách experiences
      description: Danh sách experiences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperiencePageEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Opaque cursor scoped to resource/snapshot.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          description: Upper limit from approved runtime policy; no production default chosen here.
      x-required-permission: experience.config.read
    post:
      operationId: createExperience
      tags:
        - Studio Experiences
      summary: Tạo experience metadata và draft resource
      description: Tạo experience metadata và draft resource
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceMetadataEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperienceInput'
      x-required-permission: experience.config.write
  /admin/experiences/{id}:
    get:
      operationId: readExperience
      tags:
        - Studio Experiences
      summary: Đọc metadata và config overview
      description: Đọc metadata và config overview
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceMetadataEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.read
    patch:
      operationId: patchExperience
      tags:
        - Studio Experiences
      summary: Sửa metadata với revision guard
      description: Sửa metadata với revision guard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceMetadataEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchExperienceInput'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.write
  /admin/experiences/{id}/draft:
    get:
      operationId: readExperienceDraft
      tags:
        - Studio Experiences
      summary: Đọc current draft
      description: Đọc current draft
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceDraftEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.read
    put:
      operationId: saveExperienceDraft
      tags:
        - Studio Experiences
      summary: Lưu draft với optimistic locking
      description: Allow incomplete JSON object draft, reject malformed/oversized input. expected_revision belongs
        to draft; same key/payload replays original save before stale revision check. Atomic update increases draft
        revision/hash; previous reports become stale. No changes to pinned released activities.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceDraftEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftInput'
            examples:
              draft:
                $ref: '#/components/examples/IncompleteDraft'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.write
components:
  schemas:
    AssessmentDefinitionOption:
      type: object
      properties:
        option_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        label:
          type: string
          minLength: 1
      required:
        - option_id
        - label
      additionalProperties: false
    AssessmentDefinitionQuestion:
      type: object
      properties:
        question_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        prompt:
          type: string
          minLength: 1
        choices:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentDefinitionOption'
          minItems: 2
      required:
        - question_id
        - prompt
        - choices
      additionalProperties: false
    AssessmentHouseMetadata:
      type: object
      properties:
        house_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        name:
          type: string
          minLength: 1
        theme_ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        mascot_ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        strengths:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        tendencies:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        suggested_fields:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        quote:
          type: string
          minLength: 1
      required:
        - house_id
        - name
        - theme_ref
        - mascot_ref
        - strengths
        - tendencies
        - suggested_fields
        - quote
      additionalProperties: false
    AssessmentRuleDocument:
      type: object
      properties:
        rule_schema_ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        engine_version:
          type: string
          minLength: 1
        payload:
          type: object
      required:
        - rule_schema_ref
        - engine_version
        - payload
      additionalProperties: false
      description: Transport only. Payload MUST be validated against a supported registered rule schema. DEC-04
        unresolved; no rule schema is registered by this contract.
      x-pending-decision: DEC-04
    AssessmentGoldenCase:
      type: object
      properties:
        case_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        mandatory:
          type: boolean
        answers:
          type: array
          items:
            type: object
            properties:
              question_id:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
              option_id:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
            required:
              - question_id
              - option_id
            additionalProperties: false
          minItems: 6
          maxItems: 6
        expected:
          type: object
          properties:
            question_ids:
              type: array
              items:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
              minItems: 6
              maxItems: 6
            house_id:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
            scores:
              type: object
              additionalProperties:
                type: number
          required:
            - question_ids
            - house_id
            - scores
          additionalProperties: false
      required:
        - case_id
        - mandatory
        - answers
        - expected
      additionalProperties: false
    ExperienceDefinitionDocument:
      type: object
      properties:
        schema_version:
          type: string
          enum:
            - '1.0'
        definition_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        definition_version:
          type: string
          minLength: 1
        engine_version:
          type: string
          minLength: 1
        is_demo:
          type: boolean
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentDefinitionQuestion'
          minItems: 6
        houses:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentHouseMetadata'
          minItems: 6
          maxItems: 6
        selection_rules:
          $ref: '#/components/schemas/AssessmentRuleDocument'
        scoring_rules:
          $ref: '#/components/schemas/AssessmentRuleDocument'
        coverage_rules:
          $ref: '#/components/schemas/AssessmentRuleDocument'
        tie_policy:
          $ref: '#/components/schemas/AssessmentRuleDocument'
        templates:
          type: object
          additionalProperties:
            type: string
            minLength: 1
        evaluation_cases:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentGoldenCase'
        approval_refs:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      required:
        - schema_version
        - definition_id
        - definition_version
        - engine_version
        - is_demo
        - questions
        - houses
        - selection_rules
        - scoring_rules
        - coverage_rules
        - tie_policy
        - templates
        - evaluation_cases
        - approval_refs
      additionalProperties: false
      description: |-
        Definition profile của MVP personality_assessment, được chọn theo ExperienceMetadata.activity_type.
        Questions/House/scoring không phải yêu cầu chung cho mọi Experience. Kiểu trải nghiệm mới phải
        có definition schema/engine được đăng ký và version/capability được hỗ trợ trước publish/activation.
        A structurally valid transport document is NOT publishable. DEC-04 rules require engine registration,
        semantic validation and independent golden outcomes.
    ExperienceMetadata:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        name:
          type: string
          minLength: 1
        description:
          type: string
        activity_type:
          type: string
          description: Kiểu Activity/engine của Experience. MVP hỗ trợ personality_assessment; kiểu mới cần schema/version được hỗ trợ.
          enum:
            - personality_assessment
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
        draft_ref:
          type: object
          properties:
            draft_id:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
            revision:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            content_hash:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
          required:
            - draft_id
            - revision
            - content_hash
          additionalProperties: true
          nullable: true
      required:
        - id
        - revision
        - name
        - description
        - activity_type
        - created_at
        - updated_at
        - draft_ref
      additionalProperties: true
    ExperiencePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceMetadata'
        next_cursor:
          type: string
          minLength: 1
          nullable: true
      required:
        - items
        - next_cursor
      additionalProperties: true
    CreateExperienceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        activity_type:
          type: string
          description: Chọn profile đã được đăng ký; không tự chấp nhận kiểu Experience chưa có schema/engine hỗ trợ.
          enum:
            - personality_assessment
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      required:
        - name
        - activity_type
        - idempotency_key
      additionalProperties: false
    PatchExperienceInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - expected_revision
        - idempotency_key
      additionalProperties: false
      description: Require at least one metadata field. expected_revision thuộc resource metadata; không đổi immutable
        releases hoặc draft content ngầm.
      anyOf:
        - required:
            - name
        - required:
            - description
    ExperienceDraft:
      type: object
      properties:
        experience_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        draft_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        content:
          type: object
          additionalProperties: true
        updated_by:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
      required:
        - experience_id
        - draft_id
        - revision
        - content_hash
        - content
        - updated_by
        - updated_at
      additionalProperties: true
      description: Incomplete JSON draft allowed; save không phải validation. Definition hoàn chỉnh phải theo ExperienceDefinitionDocument
        và registered DEC-04 rule schemas; no code/secrets.
    SaveDraftInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        content:
          type: object
          additionalProperties: true
      required:
        - expected_revision
        - idempotency_key
        - content
      additionalProperties: false
    ExperienceMetadataEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ExperienceMetadata'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
    ExperiencePageEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ExperiencePage'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
    ExperienceDraftEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ExperienceDraft'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
  examples:
    IncompleteDraft:
      summary: Draft chưa hoàn chỉnh vẫn lưu được.
      value:
        expected_revision: 1
        idempotency_key: save_draft_001
        content:
          questions: []
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT access token required for protected admin endpoints
