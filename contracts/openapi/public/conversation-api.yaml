openapi: 3.0.3
info:
  title: Student Discovery - Conversations
  version: 1.0.0
  description: Contract theo resource. Quy ước chung và các quyết định còn mở nằm trong user-api.yaml; xem README.md
    để chọn nhóm API. Schema dùng chung được tham chiếu bằng $ref.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server
tags:
  - name: Conversations
    description: Unified chat lifecycle/history/turns.
paths:
  /conversations:
    post:
      operationId: createConversation
      tags:
        - Conversations
      summary: Tạo conversation và greeting
      description: |-
        Học sinh không cần đăng nhập. Nếu request không có cookie sda_owner, server tạo anonymous owner
        và conversation, trả cookie qua Set-Cookie trong response 201. Không cần gọi API auth/bootstrap riêng.
        Nếu có cookie hợp lệ, dùng lại owner đó để tạo conversation. Cookie có mặt nhưng invalid/expired
        trả 401; không tự thay owner hoặc cấp quyền vào conversation cũ.
        Pin active Agent Release và initial revision; chỉ pin Experience Release khi validated activity bắt đầu.
        No active/supported Agent Release → typed error, no fake conversation. Cookie/owner không nằm trong JSON body.
        Idempotency scoped theo owner/operation. Retry cùng owner giữ nguyên key/payload; không dùng key
        để tra/replay conversation của owner khác. Nếu mất cả cookie lẫn response khởi tạo, không đảm bảo
        deduplicate xuyên owner; lần khởi tạo owner mới không khôi phục conversation cũ.
      security:
        - {}
        - AnonymousOwner: []
      responses:
        '201':
          description: Validated envelope; status matches HTTP response.
          headers:
            Set-Cookie:
              description: |-
                Có khi server cấp anonymous owner mới. Cookie chứa credential opaque do server phát hành;
                HttpOnly, host-only, Path=/api/v1, SameSite=Lax và Secure trên production HTTPS.
                TTL/token format theo policy DEC-07; không đưa credential vào JSON, URL hoặc logs.
                Browser lưu cookie và gửi lại cho các API conversation/activity/result; frontend khác origin nhưng cùng site
                cần credentials include và server cho phép credentials với origin đã cấu hình.
              schema:
                type: string
              example: sda_owner=opaque-example; Path=/api/v1; HttpOnly; Secure; SameSite=Lax
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreatedEnvelope'
              examples:
                greeting:
                  $ref: '#/components/examples/ConversationCreated'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationInput'
            examples:
              create:
                $ref: '#/components/examples/CreateConversation'
  /conversations/{conversation_id}:
    get:
      operationId: readConversation
      tags:
        - Conversations
      summary: Phục hồi chat state và active activity
      description: Authorized current state/context/pinned agent release + active activity/current question/proposal/result
        ref. No implicit new conversation. State revision is server-authoritative; history via paginated messages.
      security:
        - AnonymousOwner: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
  /conversations/{conversation_id}/messages:
    get:
      operationId: listConversationMessages
      tags:
        - Conversations
      summary: Đọc lịch sử chat phân trang
      description: Stored committed message/turn/block IDs; cursor pins conversation/snapshot watermark and stable
        order. Superseded answers/cards remain historical only. Check credential/read/retention on every page; no
        mutation or duplicate messages on reload/replay.
      security:
        - AnonymousOwner: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Opaque cursor scoped to resource/snapshot.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Demo history limit; each page rechecks owner and parent lifecycle.
  /conversations/{conversation_id}/turns:
    post:
      operationId: submitConversationTurn
      tags:
        - Conversations
      summary: Gửi message hoặc structured interaction
      description: |-
        Unified entrypoint. type=message → Agent intent/chat/validated activity commands; type=interaction → Activity Engine.
        expected_revision refers to conversation; optional expected_activity_revision is an extra guard. Activity must belong to this conversation and allow the action.
        Check owner/lifecycle, then replay key/semantic payload before old revision check; collision returns 409. JSON key order ignored; name normalization NFC/whitespace; do not paraphrase text for replay identity.
        Persist conversation revision + activity/answer/proposal/result validity + messages/blocks + outcome atomically. No DB transaction while waiting LLM; recheck both captured revisions/lifecycle before commit.
        General chat increments conversation revision only. Clarification changes activity revision, keeps progress. Sixth valid answer/coverage emits personality_card immediately.
        Edit k keeps prefix, changes k, drops suffix and invalidates old proposal/result. k=6 recomputes at progress 6; new immutable result ID + next result generation.
        Replay data/IDs/committed_at stay unchanged; meta may reflect new request. Client with newer conversation revision does not overwrite state from old replay.
      security:
        - AnonymousOwner: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/chat.yaml#/components/schemas/ConversationTurnEnvelope
              examples:
                question:
                  $ref: '#/components/examples/QuestionTurn'
                completed:
                  $ref: '#/components/examples/CompletedTurn'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/chat.yaml#/components/schemas/ConversationTurnInput
            examples:
              NaturalMessage:
                $ref: '#/components/examples/NaturalMessage'
              SubmitOption:
                $ref: '#/components/examples/SubmitOption'
              SubmitText:
                $ref: '#/components/examples/SubmitText'
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
  /conversations/{conversation_id}:end:
    post:
      operationId: endConversation
      tags:
        - Conversations
      summary: Kết thúc conversation idempotent
      description: Use :end consistently. New close checks expected conversation revision/key and closes running
        activities atomically. Repeated end returns closed state without another increment. Turns/replay cannot
        reopen closed/expired conversation. Closed/expired history/results/share reads return 410 with data null. End replies contain only the minimal acknowledgement; expiry at the exact deadline wins over end. Repeated end does not increment revision or extend retention.
      security:
        - AnonymousOwner: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/session-lifecycle.yaml#/components/schemas/ClosedConversationEnvelope
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndConversationInput'
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
components:
  schemas:
    CreateConversationInput:
      type: object
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
          default: 1
        supported_blocks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                minLength: 1
              schema_versions:
                type: array
                items:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                minItems: 1
                uniqueItems: true
            required:
              - type
              - schema_versions
            additionalProperties: false
          minItems: 1
        accepted_activity_profiles:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          uniqueItems: true
          default: []
          description: Absent/empty means legacy-only (algorithm_profile null). Explicit adaptive implies ActivityView v2 and requires the full block manifest; no implicit legacy fallback or block expansion. Supported profile is riasec.mean.bounds.v2; unknown profiles negotiate to 422 INCOMPATIBLE_SCHEMA after owner/lifecycle/replay checks.
      required:
        - idempotency_key
      additionalProperties: false
      description: |-
        Product tạo anonymous owner khi thiếu cookie, hoặc xác minh credential có sẵn trước mutation;
        chọn active Agent Release và trả greeting. Browser không gửi owner/release, không cần đăng nhập.
        Cookie được cấp qua Set-Cookie của POST /conversations; CSRF/token format/TTL còn chờ DEC-07.
        Create key scoped theo anonymous owner/operation; retry cùng owner giữ key/payload.
        Mất cả cookie và response khởi tạo không cho phép replay xuyên owner bằng idempotency_key.
        Nếu không khai báo supported_blocks, dùng bộ block v1 của MVP; chỉ gửi block/schema client được hỗ trợ.
        Idempotency keys are at most 256 ASCII identifier characters. Structurally malformed input returns 422 INVALID_INPUT.
        Unsupported capability versions/profiles or incomplete adaptive manifests return 422 INCOMPATIBLE_SCHEMA after owner/lifecycle/replay lookup and before Product resolution or writes.
        Demo TTL is exactly 3600 seconds from creation and never slides. Validate and pin capability before create.
    EndConversationInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Conversation revision đang hiển thị; không phải activity/result revision.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        schema_version:
          type: integer
          enum:
            - 1
          default: 1
      required:
        - expected_revision
        - idempotency_key
      additionalProperties: false
    ConversationCreated:
      type: object
      properties:
        conversation:
          $ref: ../schemas/chat.yaml#/components/schemas/ConversationView
        message_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        blocks:
          type: array
          items:
            $ref: ../schemas/typed-blocks.yaml#/components/schemas/TypedBlock
          minItems: 1
      required:
        - conversation
        - message_id
        - blocks
      additionalProperties: true
    StoredInteraction:
      type: object
      properties:
        activity_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        action:
          type: string
          enum:
            - set_name
            - submit_answer
            - confirm_answer
            - edit_answer
        question_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          nullable: true
        option_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          nullable: true
      required:
        - activity_id
        - action
        - question_id
        - option_id
      additionalProperties: true
      description: Projected interaction history; không gồm credentials/raw provider output. Payload gốc lưu theo
        retention/redaction policy.
    MessageView:
      type: object
      properties:
        message_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        turn_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          nullable: true
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        conversation_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        created_at:
          type: string
          format: date-time
          pattern: Z$
        text:
          type: string
          nullable: true
        interaction:
          anyOf:
            - $ref: '#/components/schemas/StoredInteraction'
            - type: object
              nullable: true
              enum:
                - null
        blocks:
          type: array
          items:
            $ref: ../schemas/typed-blocks.yaml#/components/schemas/TypedBlock
        content_status:
          type: string
          enum:
            - current
            - superseded
      required:
        - message_id
        - turn_id
        - role
        - conversation_revision
        - created_at
        - text
        - interaction
        - blocks
        - content_status
      additionalProperties: true
      description: Stored committed output. Superseded answer/card chỉ là history; current activity/result trong
        GET conversation và result API là nguồn hiệu lực.
    MessagePage:
      type: object
      properties:
        conversation_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        snapshot_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageView'
        next_cursor:
          type: string
          minLength: 1
          nullable: true
      required:
        - conversation_id
        - snapshot_revision
        - items
        - next_cursor
      additionalProperties: true
      description: Opaque cursor gắn conversation + snapshot watermark, stable message ordering; không duplicate
        khi có turn mới. Owner/read/retention kiểm ở mỗi page. History không tự ghi đè state mới.
    ConversationCreatedEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ConversationCreated'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
    ConversationEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: ../schemas/chat.yaml#/components/schemas/ConversationView
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
    MessagePageEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/MessagePage'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
  examples:
    CreateConversation:
      summary: Khởi tạo chat; chưa tạo activity.
      value:
        idempotency_key: req_create
    ConversationCreated:
      summary: Greeting đã commit.
      value:
        status: 201
        success: true
        data:
          conversation:
            id: conv_123
            schema_version: 1
            status: active
            revision: 0
            agent_release_id: agent_release_demo
            display_name: null
            active_activity: null
            created_at: '2026-10-12T03:00:00Z'
            expires_at: '2026-10-12T04:00:00Z'
          message_id: msg_greeting
          blocks:
            - block_id: block_greeting
              type: text
              schema_version: 1
              content: Bạn muốn khám phá điều gì về mình?
        error: null
        meta:
          request_id: req_example
          trace_id: trace_example
          timestamp: '2026-10-12T03:00:00Z'
    NaturalMessage:
      summary: Text tự nhiên nhận diện nhu cầu.
      value:
        type: message
        content:
          text: Mình muốn khám phá tính cách
        expected_revision: 3
        idempotency_key: req_001
    SubmitOption:
      summary: Structured answer đi thẳng Activity Engine.
      value:
        type: interaction
        activity_id: act_123
        action: submit_answer
        payload:
          question_id: q_01
          option_id: opt_B
        expected_revision: 4
        idempotency_key: req_002
    SubmitText:
      summary: Text answer được mapping theo policy.
      value:
        type: interaction
        activity_id: act_123
        action: submit_answer
        payload:
          question_id: q_01
          text: Mình thích phân tích từng bước
        expected_revision: 4
        idempotency_key: req_003
    QuestionTurn:
      summary: Conversation revision 7, activity revision 4.
      value:
        status: 200
        success: true
        data:
          conversation_id: conv_123
          schema_version: 1
          revision: 7
          turn_id: turn_007
          message_id: msg_007
          committed_at: '2026-10-12T03:00:00Z'
          activity:
            id: act_123
            conversation_id: conv_123
            type: personality_assessment
            schema_version: 1
            experience_id: exp_123
            experience_release_id: experience_release_demo
            definition_hash: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            status: in_progress
            revision: 4
            display_name: Ngân
            progress:
              completed: 3
              total: 6
            current_question:
              question_id: q_04
              title: Khi gặp vấn đề khó, bạn thường làm gì?
              options:
                - id: opt_A
                  label: Tìm giải pháp sáng tạo
                - id: opt_B
                  label: Phân tích từng bước
            clarification: null
            result: null
            is_demo: true
            created_at: '2026-10-12T03:00:00Z'
            expires_at: null
            answers:
              - answer_id: answer_1
                question_id: q_01
                option_id: opt_1A
                ordinal: 1
                accepted_activity_revision: 1
                source: option
                question:
                  question_id: q_01
                  title: Tình huống minh họa 1
                  options:
                    - id: opt_1A
                      label: A
                    - id: opt_1B
                      label: B
