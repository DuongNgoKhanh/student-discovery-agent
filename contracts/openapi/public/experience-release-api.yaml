openapi: 3.0.3
info:
  title: Student Discovery - Experience Releases
  version: 1.0.0
  description: Contract theo resource. Quy ước chung và các quyết định còn mở nằm trong admin-api.yaml; xem README.md
    để chọn nhóm API. Schema dùng chung được tham chiếu bằng $ref.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server
tags:
  - name: Studio Releases
    description: Publish immutable snapshot, environment activation/rollback.
paths:
  /admin/experiences/{id}/releases:
    post:
      operationId: publishExperienceRelease
      tags:
        - Studio Releases
      summary: Publish immutable release từ validated snapshot
      description: Check admin capability, exact draft revision/hash, supported rules/schema/engine, passing validation/evaluation
        + mandatory cases and approval policy. Expert approval is separate from technical pass. Same key replays
        created release; publish does not activate.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReleaseEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishReleaseInput'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.release.publish
    get:
      operationId: listExperienceReleases
      tags:
        - Studio Releases
      summary: Liệt kê releases của experience
      description: Liệt kê releases của experience
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReleasePageEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Opaque cursor scoped to resource/snapshot.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          description: Upper limit from approved runtime policy; no production default chosen here.
      x-required-permission: experience.config.read
  /admin/experience-releases/{release_id}:
    get:
      operationId: readExperienceRelease
      tags:
        - Studio Releases
      summary: Đọc immutable release
      description: Đọc immutable release
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReleaseEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: release_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.read
  /admin/experiences/{id}/active-release:
    get:
      operationId: readActiveExperienceRelease
      tags:
        - Studio Releases
      summary: Đọc active pointer theo environment
      description: Đọc active pointer theo environment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveReleaseEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        - name: environment
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.read
  /admin/experience-releases/{release_id}:activate:
    post:
      operationId: activateExperienceRelease
      tags:
        - Studio Releases
      summary: Activate release với pointer concurrency guard
      description: Resolve release to experience, check environment/support/approval and reject demo production.
        Check both monotonic pointer expected_revision and expected_active_release_id. Commit active pointer + audit
        atomically; existing activities/Agent releases remain pinned.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveReleaseEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateReleaseInput'
      parameters:
        - name: release_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.release.activate
  /admin/experiences/{id}:rollback:
    post:
      operationId: rollbackExperienceRelease
      tags:
        - Studio Releases
      summary: Rollback active pointer tới release đã biết
      description: Target must belong to experience/environment and be compatible/approved. Expected pointer revision
        protects ABA even if expected_active_release_id repeats. Atomic pointer/audit; future activities pin target,
        existing activities unchanged. Rollback is not revocation.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveReleaseEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackInput'
            examples:
              rollback:
                $ref: '#/components/examples/Rollback'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.release.activate
components:
  schemas:
    PublishReleaseInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        validation_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        evaluation_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        approval_refs:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      required:
        - expected_revision
        - content_hash
        - validation_id
        - evaluation_id
        - approval_refs
        - idempotency_key
      additionalProperties: false
      description: Require registered supported rules + same hash/schema/engine passing reports and mandatory cases.
        Reject DEC-04 placeholder/unsupported/stale reports. Expert approval where required. Publish does not activate.
    ExperienceRelease:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        experience_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        definition_version:
          type: string
          minLength: 1
        definition_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        definition_schema_version:
          type: string
          minLength: 1
        engine_version:
          type: string
          minLength: 1
        is_demo:
          type: boolean
        approval_refs:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        published_at:
          type: string
          format: date-time
          pattern: Z$
        published_by:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      required:
        - id
        - experience_id
        - definition_version
        - definition_hash
        - definition_schema_version
        - engine_version
        - is_demo
        - approval_refs
        - published_at
        - published_by
      additionalProperties: true
      description: Immutable snapshot; no PATCH/PUT to release. Every started activity pins this release; active
        pointer change never migrates existing activity.
    ExperienceReleasePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceRelease'
        next_cursor:
          type: string
          minLength: 1
          nullable: true
      required:
        - items
        - next_cursor
      additionalProperties: true
    ActiveReleasePointer:
      type: object
      properties:
        experience_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        environment:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        release_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          nullable: true
        updated_at:
          type: string
          format: date-time
          pattern: Z$
      required:
        - experience_id
        - environment
        - revision
        - release_id
        - updated_at
      additionalProperties: true
    ActivateReleaseInput:
      type: object
      properties:
        environment:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        expected_active_release_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          nullable: true
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        reason:
          type: string
          minLength: 1
      required:
        - environment
        - expected_revision
        - expected_active_release_id
        - idempotency_key
        - reason
      additionalProperties: false
      description: Target release in path. expected_revision refers to active pointer; expected_active_release_id
        is an additional guard, not a replacement for monotonic revision (ABA prevention).
    RollbackInput:
      type: object
      properties:
        environment:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        expected_active_release_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          nullable: true
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        reason:
          type: string
          minLength: 1
        target_release_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      required:
        - environment
        - expected_revision
        - expected_active_release_id
        - idempotency_key
        - reason
        - target_release_id
      additionalProperties: false
      description: Update pointer/audit atomically to an existing compatible release. Reject demo in production;
        approval/environment checks. Only new activities use target; not revocation of pinned releases.
    ExperienceReleaseEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ExperienceRelease'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
    ExperienceReleasePageEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ExperienceReleasePage'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
    ActiveReleaseEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ActiveReleasePointer'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
  examples:
    Rollback:
      summary: Pointer revision thêm để tránh ABA.
      value:
        target_release_id: rel_v12
        expected_active_release_id: rel_v13
        expected_revision: 8
        environment: demo
        reason: Rollback after evaluation regression
        idempotency_key: rollback_001
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT access token required for protected admin endpoints
