openapi: 3.0.3
info:
  title: Student Discovery - Authentication
  version: 1.0.0
  description: Contract theo resource. Quy ước chung và các quyết định còn mở nằm trong user-api.yaml; xem README.md
    để chọn nhóm API. Schema dùng chung được tham chiếu bằng $ref.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server
tags:
  - name: Authentication
    description: Email/password auth and token management
paths:
  /auth/session:
    get:
      tags:
        - Authentication
      summary: Read verified session metadata
      description: Read the current user or admin access session without refreshing tokens or setting cookies.
      operationId: readSession
      security:
        - BearerAuth: []
        - AccessCookie: []
      responses:
        '200':
          description: Verified session metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user with email and password
      description: Create a new account and short-lived access token. Refresh is an opaque, rotating HttpOnly cookie only. Registration is rate limited to 20 attempts per trusted peer and 5 per email per 15 minutes.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully and tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: CONFLICT_EMAIL_EXISTS - email is already registered
          content:
            application/json:
              schema:
                $ref: ../schemas/common.yaml#/components/schemas/ErrorResponse
        '429':
          description: AUTH_RATE_LIMITED - too many registration attempts
          content:
            application/json:
              schema:
                $ref: ../schemas/common.yaml#/components/schemas/ErrorResponse
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user with email and password
      description: Authenticate an existing user and return a short-lived access JWT. The rotating refresh credential is set only as an HttpOnly cookie (SameSite=Lax; Path=/api/v1/auth; Secure in production). Access defaults to 30 minutes (15-60), refresh sessions to 14 days (7-30).
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Rotate the HttpOnly refresh cookie and issue an access JWT. Requires matching external Origin (PRODUCT_BASE_URL when configured) or Sec-Fetch-Site same-origin. Reuse revokes the session family. Refresh credentials are never accepted in JSON. The access JWT expires in 30 minutes by default; the user access cookie remains until the absolute refresh-session expiry so clients can recognize AUTH_TOKEN_EXPIRED and recover. Admin access cookies expire with their JWT.
      operationId: refreshToken
      security:
        - RefreshCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: AUTH_CSRF_REJECTED - request did not prove same-origin
          content:
            application/json:
              schema:
                $ref: ../schemas/common.yaml#/components/schemas/ErrorResponse
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Revoke the refresh session and its linked user access tokens (or the family named by a valid, unexpired access JWT when the refresh cookie is absent), then clear both cookie paths including legacy root refresh cookies. Requires matching external Origin (PRODUCT_BASE_URL when configured) or Sec-Fetch-Site same-origin. Returns data {ok:true}.
      operationId: logoutUser
      responses:
        '200':
          description: Auth cookies cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '403':
          description: AUTH_CSRF_REJECTED - request did not prove same-origin
          content:
            application/json:
              schema:
                $ref: ../schemas/common.yaml#/components/schemas/ErrorResponse
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: sda_refresh
      description: HttpOnly rotating opaque credential. Cookie path is /api/v1/auth; production cookies use Secure.
    AccessCookie:
      type: apiKey
      in: cookie
      name: sda_access
      description: HttpOnly access cookie; name may be configured by deployment.
  schemas:
    SessionMetadata:
      description: Typed principal metadata. Numeric database user IDs remain numeric elsewhere; the session principal ID is a string.
      oneOf:
        - type: object
          required: [principal, is_admin]
          properties:
            principal:
              type: object
              required: [type, id]
              properties:
                type:
                  type: string
                  enum: [user]
                id:
                  type: string
                  pattern: '^[1-9]\d*$'
            is_admin:
              type: boolean
              enum: [false]
        - type: object
          required: [principal, is_admin]
          properties:
            principal:
              type: object
              required: [type, id]
              properties:
                type:
                  type: string
                  enum: [admin]
                id:
                  type: string
                  enum: [admin]
            is_admin:
              type: boolean
              enum: [true]
    SessionResponse:
      allOf:
        - $ref: ../schemas/common.yaml#/components/schemas/ApiResponse
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/SessionMetadata'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      description: Optional empty JSON object. The refresh credential is read only from the cookie.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          description: User password
          example: strongpassword123
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          description: User password
          example: strongpassword123
        name:
          type: string
          description: User's full name
          nullable: true
          example: John Doe
        avatar_url:
          type: string
          format: uri
          description: URL to user's avatar image
          nullable: true
          example: https://example.com/avatars/user_1.jpg
        bio:
          type: string
          description: User biography
          nullable: true
          example: Software developer with 5 years experience
        position:
          type: string
          description: User job position
          nullable: true
          example: Senior Developer
    TokenRefreshResponse:
      allOf:
        - $ref: ../schemas/common.yaml#/components/schemas/ApiResponse
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - access_token
                - token_type
                - expires_in
              properties:
                access_token:
                  type: string
                  description: New JWT access token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type:
                  type: string
                  enum:
                    - bearer
                  example: bearer
                expires_in:
                  type: integer
                  description: Token expiration time in seconds
                  example: 1800
    AuthResponse:
      type: object
      required:
        - success
        - data
        - status
        - error
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Authentication successful
          nullable: true
        data:
          type: object
          required: [user, access_token, token_type, expires_in]
          properties:
            user:
              $ref: profile-api.yaml#/components/schemas/UserProfile
            access_token:
              type: string
              description: JWT access token
            token_type:
              type: string
              enum:
                - bearer
            expires_in:
              type: integer
              description: Token expiration in seconds
        status:
          type: integer
          description: HTTP status; inspect success even for HTTP 200.
        error:
          anyOf:
            - $ref: ../schemas/common.yaml#/components/schemas/ErrorDetail
            - type: object
              nullable: true
              enum:
                - null
        meta:
          $ref: ../schemas/common.yaml#/components/schemas/ResponseMeta
    LogoutResponse:
      allOf:
        - $ref: ../schemas/common.yaml#/components/schemas/ApiResponse
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - ok
              properties:
                ok:
                  type: boolean
                  enum:
                    - true
  responses:
    UnauthorizedError:
      description: AUTH_TOKEN_MISSING requires login; AUTH_TOKEN_INVALID requires login; AUTH_TOKEN_EXPIRED allows one refresh attempt. Revoked sessions return AUTH_TOKEN_INVALID.
      content:
        application/json:
          schema:
            $ref: ../schemas/common.yaml#/components/schemas/ErrorResponse
          example:
            status: 401
            success: false
            message: You are not logged in or your session has expired. Please log in again.
            data: null
            error:
              code: AUTH_TOKEN_INVALID
              message: You are not logged in or your session has expired. Please log in again.
              details: null
              retryable: false
            meta:
              request_id: req-example
              trace_id: trace-example
              timestamp: '2026-10-12T03:00:00Z'
