openapi: 3.0.3
info:
  title: Student Discovery - Authentication
  version: 1.0.0
  description: Contract theo resource. Quy ước chung và các quyết định còn mở nằm trong user-api.yaml; xem README.md
    để chọn nhóm API. Schema dùng chung được tham chiếu bằng $ref.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server
tags:
  - name: Authentication
    description: Email/password auth and token management
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user with email and password
      description: Create a new user account and return authentication tokens.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully and tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user with email and password
      description: Authenticate an existing user and return JWT access and refresh tokens.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Exchange a refresh token for a new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/BadRequestError
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Clear the access and refresh cookies. Always responds with an envelope whose data is {ok:true}.
      operationId: logoutUser
      responses:
        '200':
          description: Auth cookies cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: ../schemas/common.yaml#/components/responses/InternalServerError
components:
  schemas:
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: The refresh token to exchange for a new access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          description: User password
          example: strongpassword123
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          description: User password
          example: strongpassword123
        name:
          type: string
          description: User's full name
          nullable: true
          example: John Doe
        avatar_url:
          type: string
          format: uri
          description: URL to user's avatar image
          nullable: true
          example: https://example.com/avatars/user_1.jpg
        bio:
          type: string
          description: User biography
          nullable: true
          example: Software developer with 5 years experience
        position:
          type: string
          description: User job position
          nullable: true
          example: Senior Developer
    TokenRefreshResponse:
      allOf:
        - $ref: ../schemas/common.yaml#/components/schemas/ApiResponse
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - access_token
                - token_type
                - expires_in
              properties:
                access_token:
                  type: string
                  description: New JWT access token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type:
                  type: string
                  enum:
                    - bearer
                  example: bearer
                expires_in:
                  type: integer
                  description: Token expiration time in seconds
                  example: 3600
    AuthResponse:
      type: object
      required:
        - success
        - data
        - status
        - error
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Authentication successful
          nullable: true
        data:
          type: object
          properties:
            user:
              $ref: profile-api.yaml#/components/schemas/UserProfile
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: Refresh token for obtaining new access tokens
            token_type:
              type: string
              enum:
                - bearer
            expires_in:
              type: integer
              description: Token expiration in seconds
        status:
          type: integer
          description: HTTP status; inspect success even for HTTP 200.
        error:
          anyOf:
            - $ref: ../schemas/common.yaml#/components/schemas/ErrorDetail
            - type: object
              nullable: true
              enum:
                - null
        meta:
          $ref: ../schemas/common.yaml#/components/schemas/ResponseMeta
    LogoutResponse:
      allOf:
        - $ref: ../schemas/common.yaml#/components/schemas/ApiResponse
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - ok
              properties:
                ok:
                  type: boolean
                  enum:
                    - true
  responses:
    UnauthorizedError:
      description: Unauthorized - Invalid, missing, or expired authentication token
      content:
        application/json:
          schema:
            $ref: ../schemas/common.yaml#/components/schemas/ErrorResponse
          example:
            status: 401
            success: false
            message: You are not logged in or your session has expired. Please log in again.
            data: null
            error:
              code: AUTH_INVALID_TOKEN
              message: You are not logged in or your session has expired. Please log in again.
              details: null
              retryable: false
            meta:
              request_id: req-example
              trace_id: trace-example
              timestamp: '2026-10-12T03:00:00Z'
