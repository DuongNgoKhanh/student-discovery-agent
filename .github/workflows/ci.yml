name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch name convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^((feat|fix|refactor|docs|test|chore|build|perf|hotfix)/[a-z0-9]+(-[a-z0-9]+)*|release/v[0-9]+\.[0-9]+\.[0-9]+|dependabot/.+)$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch '$BRANCH' follows the naming convention."
          else
            echo "::error::Branch '$BRANCH' does not follow <type>/<feature-slug>, e.g. feat/adaptive-selector or fix/sequence-replay. Allowed types: feat, fix, refactor, docs, test, chore, build, perf, hotfix. See .github/commit_guide.instructions.md."
            exit 1
          fi

  web-ui:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-ui
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm gen:api
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  studio-api:
    name: Studio API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/studio-api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/studio-api/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm gen:api
      - name: Check contracts
        run: pnpm contracts:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  studio-api-integration:
    name: Studio API Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/studio-api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/studio-api/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm gen:api
      # Testcontainers starts disposable Postgres and MinIO on the runner's Docker daemon.
      - name: Integration tests
        run: pnpm test:integration

  agent-runtime:
    name: Agent Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: apps/agent-runtime/.python-version
          cache: pip
          cache-dependency-path: |
            apps/agent-runtime/requirements.txt
            apps/agent-runtime/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check --output-format=github .
      - name: Tests
        run: python -m pytest

  docker-build:
    name: Docker Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web-ui
            target: runner
          - app: studio-api
            target: runner
          - app: agent-runtime
            target: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only; images are not pushed until a deploy target exists.
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          build-contexts: contracts=contracts
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
