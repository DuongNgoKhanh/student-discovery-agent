map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $studio_api http://studio-api:3001;
    set $web_ui http://web-ui:3000;

    # Leave upload validation and its structured errors to the API.
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Trace-ID $http_x_trace_id;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass $studio_api$request_uri;
    }

    location = /download {
        proxy_pass $studio_api$request_uri;
    }

    location = /ready {
        proxy_pass $studio_api/ready;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $web_ui$request_uri;
    }
}
