[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Isolated Python agent runtime foundation"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.17.1"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires a disposable PostgreSQL 16 database"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Explicit list: ruff's default rule set changes between releases.
select = ["E4", "E7", "E9", "F", "I", "B"]
